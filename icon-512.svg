<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.5"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.2"/>
  <polygon points="256,76 285,178 392,178 307,240 336,342 256,280 176,342 205,240 120,178 227,178" fill="url(#gold)" filter="url(#glow)" opacity="0.95"/>
  <text x="256" y="295" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">ك.س</text>
  <rect x="120" y="380" width="272" height="2" fill="url(#gold)" opacity="0.5"/>
  <text x="256" y="430" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="url(#gold)" text-anchor="middle" opacity="0.95">الكابتن سعيد</text>
  <text x="256" y="465" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">منظومة الحركات المالية</text>
</svg>
